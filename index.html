<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Whisper Chiaroscuro — Формантный тренажёр</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-deep: #070b14;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-touch-callout: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: var(--bg-deep);
      color: #f8fafc;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    .mono {
      font-family: 'JetBrains Mono', monospace;
    }

    @keyframes pulse-ring {
      0% { transform: scale(0.95); opacity: 0.7; }
      50% { transform: scale(1.06); opacity: 0.3; }
      100% { transform: scale(0.95); opacity: 0.7; }
    }

    .mic-pulse {
      animation: pulse-ring 2.4s infinite ease-in-out;
    }

    #visualizer-canvas {
      touch-action: none;
      cursor: grab;
    }

    #visualizer-canvas:active {
      cursor: grabbing;
    }

    #calibrate-hold-btn {
      touch-action: none;
    }

    #calibrate-hold-btn.calibrating-active {
      background: rgba(251, 191, 36, 0.22);
      border-color: #fbbf24;
      color: #fde68a;
      transform: scale(0.985);
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      background: transparent;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-runnable-track {
      height: 6px;
      border-radius: 999px;
      background: #1e293b;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #38bdf8;
      border: 2px solid #0f172a;
      margin-top: -6px;
      box-shadow: 0 0 8px rgba(56, 189, 248, 0.5);
    }
  </style>
</head>
<body class="w-full h-full flex flex-col justify-between relative">

  <div id="app-shell" class="w-full h-full flex flex-col justify-between p-2 sm:p-3.5 relative z-10 gap-2">

    <!-- Minimalist Navigation & Scale Bar -->
    <header class="w-full rounded-xl bg-slate-900/90 border border-slate-800/90 px-3 py-2 flex flex-wrap items-center justify-between gap-3 shrink-0">
      <div class="flex items-center gap-3 flex-1 min-w-[200px]">
        <span class="text-[11px] font-semibold text-slate-400 whitespace-nowrap">Позиция (Гц):</span>
        <input id="pan-slider" type="range" min="400" max="3200" step="10" value="1150" class="w-full" />
        <span id="range-label" class="mono text-[11px] text-slate-300 whitespace-nowrap">1150–3950 Гц</span>
      </div>

      <div class="flex items-center gap-2.5 w-full sm:w-auto sm:min-w-[190px]">
        <span class="text-[11px] font-semibold text-slate-400 whitespace-nowrap">Масштаб:</span>
        <input id="zoom-slider" type="range" min="1400" max="4000" step="50" value="2800" class="w-full sm:w-28" />
        <span class="text-[10px] text-slate-500 hidden sm:inline whitespace-nowrap">Можно двигать график пальцем</span>
      </div>
    </header>

    <main class="w-full flex-1 relative rounded-2xl overflow-hidden bg-slate-950 border border-slate-800/90 shadow-inner flex flex-col">
      <canvas id="visualizer-canvas" class="w-full h-full block"></canvas>

      <!-- Floating Press-and-Hold Calibration Button -->
      <div id="controls-bar" class="hidden absolute bottom-3 left-3 right-3 flex items-center justify-center pointer-events-none">
        <button id="calibrate-hold-btn" type="button"
          class="pointer-events-auto w-full sm:w-auto sm:min-w-[320px] py-3 px-5 rounded-xl bg-slate-900/90 backdrop-blur-md border border-slate-700 text-slate-200 font-semibold text-xs sm:text-sm tracking-wide shadow-xl flex items-center justify-center gap-2.5 transition-all duration-150 cursor-pointer">
          <span id="calib-btn-dot" class="w-2 h-2 rounded-full bg-amber-400"></span>
          <span id="calib-btn-text">УДЕРЖИВАЙТЕ ДЛЯ КАЛИБРОВКИ ПУНКТИРНЫХ ЛИНИЙ</span>
        </button>
      </div>
    </main>

    <div id="start-overlay" class="absolute inset-0 z-30 bg-slate-950/95 backdrop-blur-md flex flex-col items-center justify-center p-6 text-center">
      <div class="max-w-sm w-full flex flex-col items-center">
        <div class="relative mb-6 flex items-center justify-center">
          <div class="w-24 h-24 rounded-full bg-sky-500/15 mic-pulse absolute"></div>
          <button id="start-mic-btn" type="button"
            class="relative z-10 w-20 h-20 rounded-full bg-sky-400 text-slate-950 shadow-xl shadow-sky-500/20 flex items-center justify-center active:scale-95 transition-transform duration-150 cursor-pointer">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-9 h-9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path>
              <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
              <line x1="12" x2="12" y1="19" y2="22"></line>
            </svg>
          </button>
        </div>

        <h1 class="text-xl sm:text-2xl font-bold text-white tracking-tight mb-2">
          Формантный водопад
        </h1>
        <p class="text-sm text-slate-300 leading-relaxed mb-6">
          Чистая спектрограмма шёпота без порога громкости.<br/>
          Перетаскивайте график пальцем влево-вправо или ползунком, а для установки двух пунктирных ориентиров зажмите кнопку калибровки.
        </p>

        <button id="start-mic-text-btn" type="button"
          class="w-full py-3.5 px-6 rounded-xl bg-sky-400 text-slate-950 font-bold text-base shadow-lg shadow-sky-500/20 active:scale-98 transition cursor-pointer">
          Включить микрофон
        </button>

        <div id="mic-error-box" class="hidden mt-4 p-3.5 rounded-xl bg-rose-950/90 border border-rose-700 text-rose-200 text-xs text-left leading-relaxed"></div>
      </div>
    </div>

  </div>

  <script>
    (function () {
      const ABS_MIN_HZ = 300;
      const ABS_MAX_HZ = 5200;

      // Search range for calibration & live formant peak labels
      const FORMANT_SEARCH_MIN_HZ = 1550;
      const FORMANT_SEARCH_MAX_HZ = 4300;
      const MIN_PEAK_SEPARATION_HZ = 280;
      const MAX_PEAK_SEPARATION_HZ = 1450;

      // Two dashed reference lines (calibrated via hold button)
      let refF1 = 2461;
      let refF2 = 3059;

      // User-controlled frequency viewport (pan & span)
      let displayMinHz = 1150;
      let displaySpanHz = 2800;
      let displayMaxHz = displayMinHz + displaySpanHz;

      let isCalibratingHold = false;

      // Smoothed live formant peak frequencies for top-of-graph readout
      let liveF1Hz = 2461;
      let liveF2Hz = 3059;
      let liveF1Prominence = 0;
      let liveF2Prominence = 0;

      // Waterfall configuration and history buffer (for sharp redrawing on finger drag)
      const WATERFALL_SPEED_PX = 2;
      const TOP_HEADER_HEIGHT = 82;
      const MAX_HISTORY_ROWS = 600;
      let ridgeHistory = [];

      // Audio Web API objects
      let audioCtx = null;
      let analyser = null;
      let rawFreqData = null;
      let smoothedEnvelope = null;
      let temporalSpectrum = null;
      let normalizedRidge = null;
      let isRunning = false;
      let needsFullWaterfallRedraw = false;

      const startOverlay = document.getElementById('start-overlay');
      const startMicBtn = document.getElementById('start-mic-btn');
      const startMicTextBtn = document.getElementById('start-mic-text-btn');
      const micErrorBox = document.getElementById('mic-error-box');
      const controlsBar = document.getElementById('controls-bar');
      const calibrateHoldBtn = document.getElementById('calibrate-hold-btn');
      const calibBtnDot = document.getElementById('calib-btn-dot');
      const calibBtnText = document.getElementById('calib-btn-text');

      const panSlider = document.getElementById('pan-slider');
      const zoomSlider = document.getElementById('zoom-slider');
      const rangeLabel = document.getElementById('range-label');

      const canvas = document.getElementById('visualizer-canvas');
      const ctx = canvas.getContext('2d');

      const waterfallCanvas = document.createElement('canvas');
      const waterfallCtx = waterfallCanvas.getContext('2d');

      let canvasWidth = 320;
      let canvasHeight = 460;
      let waterfallHeight = 378;
      let dpr = window.devicePixelRatio || 1;

      // Precompute 256-level clean spectrogram colormap (only depends on intensity)
      // Deep navy -> Slate blue -> Cyan -> Warm ivory
      const colorLUT = new Uint8Array(256 * 3);
      (function buildColormap() {
        const stops = [
          { pos: 0.00, rgb: [5, 8, 17] },
          { pos: 0.25, rgb: [15, 32, 67] },
          { pos: 0.55, rgb: [14, 116, 144] },
          { pos: 0.80, rgb: [56, 189, 248] },
          { pos: 1.00, rgb: [248, 250, 252] }
        ];
        for (let i = 0; i < 256; i++) {
          const t = i / 255;
          let s0 = stops[0];
          let s1 = stops[stops.length - 1];
          for (let j = 0; j < stops.length - 1; j++) {
            if (t >= stops[j].pos && t <= stops[j + 1].pos) {
              s0 = stops[j];
              s1 = stops[j + 1];
              break;
            }
          }
          const localT = s1.pos === s0.pos ? 0 : (t - s0.pos) / (s1.pos - s0.pos);
          colorLUT[i * 3] = Math.round(s0.rgb[0] + (s1.rgb[0] - s0.rgb[0]) * localT);
          colorLUT[i * 3 + 1] = Math.round(s0.rgb[1] + (s1.rgb[1] - s0.rgb[1]) * localT);
          colorLUT[i * 3 + 2] = Math.round(s0.rgb[2] + (s1.rgb[2] - s0.rgb[2]) * localT);
        }
      })();

      function updateViewportBounds(newMinHz, newSpanHz) {
        displaySpanHz = Math.max(1000, Math.min(4200, newSpanHz));
        const maxAllowedMin = Math.max(ABS_MIN_HZ, ABS_MAX_HZ - displaySpanHz);
        displayMinHz = Math.max(ABS_MIN_HZ, Math.min(maxAllowedMin, newMinHz));
        displayMaxHz = displayMinHz + displaySpanHz;

        panSlider.max = String(Math.round(maxAllowedMin));
        panSlider.value = String(Math.round(displayMinHz));
        zoomSlider.value = String(Math.round(displaySpanHz));
        rangeLabel.textContent = `${Math.round(displayMinHz)}–${Math.round(displayMaxHz)} Гц`;
        needsFullWaterfallRedraw = true;
      }

      panSlider.addEventListener('input', () => {
        updateViewportBounds(Number(panSlider.value), displaySpanHz);
      });

      zoomSlider.addEventListener('input', () => {
        const centerHz = displayMinHz + displaySpanHz * 0.5;
        const nextSpan = Number(zoomSlider.value);
        updateViewportBounds(centerHz - nextSpan * 0.5, nextSpan);
      });

      // Horizontal drag-to-pan on canvas
      let isDraggingCanvas = false;
      let dragStartX = 0;
      let dragStartMinHz = 0;

      canvas.addEventListener('pointerdown', (e) => {
        isDraggingCanvas = true;
        dragStartX = e.clientX;
        dragStartMinHz = displayMinHz;
        if (canvas.setPointerCapture) {
          try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
        }
      });

      window.addEventListener('pointermove', (e) => {
        if (!isDraggingCanvas) return;
        const dx = e.clientX - dragStartX;
        const hzPerPx = displaySpanHz / Math.max(1, canvasWidth);
        updateViewportBounds(dragStartMinHz - dx * hzPerPx, displaySpanHz);
      });

      function stopCanvasDrag() {
        isDraggingCanvas = false;
      }
      window.addEventListener('pointerup', stopCanvasDrag);
      window.addEventListener('pointercancel', stopCanvasDrag);

      // Mouse wheel zoom/pan support
      canvas.addEventListener('wheel', (e) => {
        e.preventDefault();
        if (Math.abs(e.deltaX) > Math.abs(e.deltaY)) {
          const hzShift = (e.deltaX / canvasWidth) * displaySpanHz;
          updateViewportBounds(displayMinHz + hzShift, displaySpanHz);
        } else {
          const factor = e.deltaY > 0 ? 1.08 : 0.92;
          const centerHz = displayMinHz + displaySpanHz * 0.5;
          const nextSpan = Math.max(1200, Math.min(4000, displaySpanHz * factor));
          updateViewportBounds(centerHz - nextSpan * 0.5, nextSpan);
        }
      }, { passive: false });

      function resizeCanvas() {
        dpr = Math.min(window.devicePixelRatio || 1, 2.0);
        const rect = canvas.getBoundingClientRect();
        canvasWidth = Math.max(240, Math.floor(rect.width));
        canvasHeight = Math.max(240, Math.floor(rect.height));
        waterfallHeight = Math.max(120, canvasHeight - TOP_HEADER_HEIGHT);

        canvas.width = Math.round(canvasWidth * dpr);
        canvas.height = Math.round(canvasHeight * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        waterfallCanvas.width = canvasWidth;
        waterfallCanvas.height = waterfallHeight;
        needsFullWaterfallRedraw = true;
      }

      window.addEventListener('resize', resizeCanvas);
      resizeCanvas();
      updateViewportBounds(displayMinHz, displaySpanHz);

      function beginHoldCalibration(e) {
        if (e && e.cancelable) e.preventDefault();
        if (!isRunning) return;
        isCalibratingHold = true;
        calibrateHoldBtn.classList.add('calibrating-active');
        calibBtnDot.className = 'w-2 h-2 rounded-full bg-amber-300 animate-ping';
        calibBtnText.textContent = 'ФИКСАЦИЯ ЛИНИЙ ПО ШЁПОТУ... ОТПУСТИТЕ ДЛЯ ГОТОВНОСТИ';
      }

      function endHoldCalibration(e) {
        if (!isCalibratingHold) return;
        if (e && e.cancelable) e.preventDefault();
        isCalibratingHold = false;
        calibrateHoldBtn.classList.remove('calibrating-active');
        calibBtnDot.className = 'w-2 h-2 rounded-full bg-amber-400';
        calibBtnText.textContent = 'УДЕРЖИВАЙТЕ ДЛЯ КАЛИБРОВКИ ПУНКТИРНЫХ ЛИНИЙ';
      }

      calibrateHoldBtn.addEventListener('pointerdown', beginHoldCalibration);
      window.addEventListener('pointerup', endHoldCalibration);
      window.addEventListener('pointercancel', endHoldCalibration);
      calibrateHoldBtn.addEventListener('touchstart', beginHoldCalibration, { passive: false });
      window.addEventListener('touchend', endHoldCalibration);

      async function startMicrophone() {
        micErrorBox.classList.add('hidden');
        try {
          let stream;
          try {
            stream = await navigator.mediaDevices.getUserMedia({
              audio: {
                echoCancellation: false,
                noiseSuppression: false,
                autoGainControl: false,
                channelCount: 1
              }
            });
          } catch (constraintErr) {
            stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          }

          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          audioCtx = new AudioContextClass();
          if (audioCtx.state === 'suspended') {
            await audioCtx.resume();
          }

          const source = audioCtx.createMediaStreamSource(stream);
          analyser = audioCtx.createAnalyser();
          analyser.fftSize = 4096;
          analyser.smoothingTimeConstant = 0.55;

          source.connect(analyser);

          const binCount = analyser.frequencyBinCount;
          rawFreqData = new Float32Array(binCount);
          smoothedEnvelope = new Float32Array(binCount);
          temporalSpectrum = new Float32Array(binCount);
          normalizedRidge = new Float32Array(binCount);
          temporalSpectrum.fill(-110);

          startOverlay.classList.add('hidden');
          controlsBar.classList.remove('hidden');
          resizeCanvas();

          isRunning = true;
          requestAnimationFrame(animateLoop);
        } catch (err) {
          micErrorBox.textContent =
            'Не удалось получить доступ к микрофону. Пожалуйста, разрешите использование микрофона в настройках браузера и обновите страницу.';
          micErrorBox.classList.remove('hidden');
        }
      }

      startMicBtn.addEventListener('click', startMicrophone);
      startMicTextBtn.addEventListener('click', startMicrophone);

      function freqToBin(hz, sampleRate, binCount) {
        const nyquist = sampleRate / 2;
        return Math.max(0, Math.min(binCount - 1, Math.round((hz / nyquist) * binCount)));
      }

      function binToFreq(bin, sampleRate, binCount) {
        const nyquist = sampleRate / 2;
        return (bin / binCount) * nyquist;
      }

      function analyzeWhisperFormants() {
        analyser.getFloatFrequencyData(rawFreqData);
        const sampleRate = audioCtx.sampleRate || 48000;
        const binCount = analyser.frequencyBinCount;

        const minAnBin = freqToBin(ABS_MIN_HZ, sampleRate, binCount);
        const maxAnBin = freqToBin(ABS_MAX_HZ, sampleRate, binCount);

        // 1. Temporal smoothing + gentle high-frequency pre-emphasis for whisper
        for (let b = minAnBin; b <= maxAnBin; b++) {
          let val = rawFreqData[b];
          if (!Number.isFinite(val) || val < -140) val = -140;
          const freq = binToFreq(b, sampleRate, binCount);
          const preEmphasisDb = Math.max(0, (freq - 1000) / 1000) * 3.4;
          const boosted = val + preEmphasisDb;
          temporalSpectrum[b] = temporalSpectrum[b] * 0.52 + boosted * 0.48;
        }

        // 2. Smooth spectral envelope (~140 Hz window) to highlight formant hills
        const halfWindowBins = Math.max(4, Math.round(70 / (sampleRate / (binCount * 2))));
        let sumEnv = 0;
        let countEnv = 0;
        let maxEnvDb = -160;

        for (let b = minAnBin; b <= maxAnBin; b++) {
          let weightedSum = 0;
          let weightTotal = 0;
          for (let k = -halfWindowBins; k <= halfWindowBins; k++) {
            const idx = b + k;
            if (idx >= minAnBin && idx <= maxAnBin) {
              const w = halfWindowBins + 1 - Math.abs(k);
              weightedSum += temporalSpectrum[idx] * w;
              weightTotal += w;
            }
          }
          const envVal = weightedSum / weightTotal;
          smoothedEnvelope[b] = envVal;
          sumEnv += envVal;
          countEnv++;
          if (envVal > maxEnvDb) maxEnvDb = envVal;
        }

        const meanEnvDb = countEnv > 0 ? sumEnv / countEnv : -110;

        // 3. Zero-threshold local ridge normalization (0..1)
        const spanRadius = Math.max(12, Math.round(310 / (sampleRate / (binCount * 2))));
        const globalSpan = Math.max(0.4, maxEnvDb - meanEnvDb);

        for (let b = minAnBin; b <= maxAnBin; b++) {
          let localMin = smoothedEnvelope[b];
          let localMax = smoothedEnvelope[b];
          for (let k = -spanRadius; k <= spanRadius; k += 2) {
            const idx = Math.max(minAnBin, Math.min(maxAnBin, b + k));
            const v = smoothedEnvelope[idx];
            if (v < localMin) localMin = v;
            if (v > localMax) localMax = v;
          }
          const localRange = Math.max(0.35, localMax - localMin);
          const localNorm = Math.max(0, Math.min(1, (smoothedEnvelope[b] - localMin) / localRange));
          const globalNorm = Math.max(0, Math.min(1, (smoothedEnvelope[b] - meanEnvDb) / globalSpan));
          normalizedRidge[b] = Math.pow(localNorm * 0.75 + globalNorm * 0.25, 1.55);
        }

        // Save compact copy of normalized ridge into history buffer for crisp panning
        const rowCopy = new Uint8Array(maxAnBin + 1);
        for (let b = minAnBin; b <= maxAnBin; b++) {
          rowCopy[b] = Math.min(255, Math.max(0, Math.round(normalizedRidge[b] * 255)));
        }
        ridgeHistory.unshift(rowCopy);
        if (ridgeHistory.length > MAX_HISTORY_ROWS) {
          ridgeHistory.pop();
        }

        const searchStartBin = freqToBin(FORMANT_SEARCH_MIN_HZ, sampleRate, binCount);
        const searchEndBin = freqToBin(FORMANT_SEARCH_MAX_HZ, sampleRate, binCount);
        const candidates = [];

        const neighborCheck = Math.max(2, Math.round(45 / (sampleRate / (binCount * 2))));
        const prominenceRadiusBins = Math.max(10, Math.round(260 / (sampleRate / (binCount * 2))));

        for (let b = searchStartBin; b <= searchEndBin; b++) {
          const val = smoothedEnvelope[b];
          let isLocalMax = true;
          for (let k = -neighborCheck; k <= neighborCheck; k++) {
            if (k !== 0 && smoothedEnvelope[b + k] > val) {
              isLocalMax = false;
              break;
            }
          }
          if (!isLocalMax) continue;

          let leftMin = val;
          for (let k = b - 1; k >= Math.max(minAnBin, b - prominenceRadiusBins); k--) {
            if (smoothedEnvelope[k] < leftMin) leftMin = smoothedEnvelope[k];
          }
          let rightMin = val;
          for (let k = b + 1; k <= Math.min(maxAnBin, b + prominenceRadiusBins); k++) {
            if (smoothedEnvelope[k] < rightMin) rightMin = smoothedEnvelope[k];
          }

          const prominence = Math.max(0.01, val - Math.max(leftMin, rightMin));
          const heightAboveMean = val - meanEnvDb;

          candidates.push({
            bin: b,
            freq: binToFreq(b, sampleRate, binCount),
            db: val,
            prominence,
            heightAboveMean
          });
        }

        let bestPair = null;
        let bestPairScore = -Infinity;

        for (let i = 0; i < candidates.length; i++) {
          for (let j = i + 1; j < candidates.length; j++) {
            const p1 = candidates[i];
            const p2 = candidates[j];
            const sep = p2.freq - p1.freq;

            if (sep < MIN_PEAK_SEPARATION_HZ || sep > MAX_PEAK_SEPARATION_HZ) continue;
            if (p1.freq > 3300 || p2.freq < 2200) continue;

            let valleyDb = Math.min(p1.db, p2.db);
            for (let b = p1.bin + 1; b < p2.bin; b++) {
              if (smoothedEnvelope[b] < valleyDb) valleyDb = smoothedEnvelope[b];
            }
            const dipDepth = Math.max(0, Math.min(p1.db, p2.db) - valleyDb);
            const contDist = Math.abs(p1.freq - liveF1Hz) + Math.abs(p2.freq - liveF2Hz);
            const continuityBonus = Math.max(0, 4.5 - contDist / 260);

            const score =
              p1.prominence * 2.2 +
              p2.prominence * 2.2 +
              p1.heightAboveMean * 1.1 +
              p2.heightAboveMean * 1.1 +
              dipDepth * 2.2 +
              continuityBonus;

            if (score > bestPairScore) {
              bestPairScore = score;
              bestPair = { p1, p2 };
            }
          }
        }

        if (bestPair) {
          liveF1Hz = liveF1Hz * 0.68 + bestPair.p1.freq * 0.32;
          liveF2Hz = liveF2Hz * 0.68 + bestPair.p2.freq * 0.32;
          liveF1Prominence = normalizedRidge[bestPair.p1.bin];
          liveF2Prominence = normalizedRidge[bestPair.p2.bin];
        }

        // Update dashed reference lines only while user holds the calibration button
        if (isCalibratingHold) {
          refF1 = refF1 * 0.82 + liveF1Hz * 0.18;
          refF2 = refF2 * 0.82 + liveF2Hz * 0.18;
        }
      }

      function freqToX(hz, width) {
        return ((hz - displayMinHz) / (displayMaxHz - displayMinHz)) * width;
      }

      function xToFreq(x, width) {
        return displayMinHz + (x / width) * (displayMaxHz - displayMinHz);
      }

      function renderRowPixels(targetData, rowOffsetPx, width, ridgeRow, sampleRate, binCount) {
        const nyquist = sampleRate / 2;
        for (let x = 0; x < width; x++) {
          const freq = xToFreq(x, width);
          const exactBin = (freq / nyquist) * binCount;
          const b0 = Math.max(0, Math.min(ridgeRow.length - 1, Math.floor(exactBin)));
          const b1 = Math.max(0, Math.min(ridgeRow.length - 1, b0 + 1));
          const frac = exactBin - b0;

          const val255 = Math.round(ridgeRow[b0] * (1 - frac) + ridgeRow[b1] * frac);
          const lutIdx = val255 * 3;
          const r = colorLUT[lutIdx];
          const g = colorLUT[lutIdx + 1];
          const b = colorLUT[lutIdx + 2];

          for (let dy = 0; dy < WATERFALL_SPEED_PX; dy++) {
            const y = rowOffsetPx + dy;
            if (y >= waterfallHeight) break;
            const idx = (y * width + x) * 4;
            targetData[idx] = r;
            targetData[idx + 1] = g;
            targetData[idx + 2] = b;
            targetData[idx + 3] = 255;
          }
        }
      }

      function updateWaterfallBitmap() {
        const w = waterfallCanvas.width;
        const h = waterfallCanvas.height;
        if (w <= 0 || h <= 0 || ridgeHistory.length === 0) return;

        const sampleRate = audioCtx ? audioCtx.sampleRate : 48000;
        const binCount = analyser ? analyser.frequencyBinCount : 2048;

        if (needsFullWaterfallRedraw) {
          needsFullWaterfallRedraw = false;
          const fullImg = waterfallCtx.createImageData(w, h);
          const data = fullImg.data;
          // Fill background
          for (let i = 0; i < data.length; i += 4) {
            data[i] = 5;
            data[i + 1] = 8;
            data[i + 2] = 17;
            data[i + 3] = 255;
          }
          const maxRows = Math.min(ridgeHistory.length, Math.ceil(h / WATERFALL_SPEED_PX));
          for (let r = 0; r < maxRows; r++) {
            renderRowPixels(data, r * WATERFALL_SPEED_PX, w, ridgeHistory[r], sampleRate, binCount);
          }
          waterfallCtx.putImageData(fullImg, 0, 0);
        } else {
          // Scroll existing waterfall down by WATERFALL_SPEED_PX and draw newest row at top
          waterfallCtx.drawImage(
            waterfallCanvas,
            0, 0, w, h - WATERFALL_SPEED_PX,
            0, WATERFALL_SPEED_PX, w, h - WATERFALL_SPEED_PX
          );
          const rowImg = waterfallCtx.createImageData(w, WATERFALL_SPEED_PX);
          renderRowPixels(rowImg.data, 0, w, ridgeHistory[0], sampleRate, binCount);
          waterfallCtx.putImageData(rowImg, 0, 0);
        }
      }

      function drawVisualizer() {
        const w = canvasWidth;
        const h = canvasHeight;
        const wfTop = TOP_HEADER_HEIGHT;

        ctx.clearRect(0, 0, w, h);

        // 1. Update and draw pure spectrogram waterfall
        updateWaterfallBitmap();
        ctx.drawImage(waterfallCanvas, 0, wfTop, w, waterfallHeight);

        // 2. Draw subtle frequency grid lines over the waterfall
        ctx.lineWidth = 1;
        ctx.font = '500 10px "JetBrains Mono", monospace';
        ctx.textAlign = 'center';

        const gridStepHz = displaySpanHz > 2600 ? 500 : 250;
        const firstGridHz = Math.ceil(displayMinHz / gridStepHz) * gridStepHz;

        for (let freq = firstGridHz; freq <= displayMaxHz; freq += gridStepHz) {
          const x = freqToX(freq, w);
          ctx.strokeStyle = 'rgba(148, 163, 184, 0.12)';
          ctx.beginPath();
          ctx.moveTo(x, wfTop);
          ctx.lineTo(x, h);
          ctx.stroke();
        }

        // 3. Draw top live spectrum strip (shows current formant hills and frequencies)
        ctx.fillStyle = '#090f1d';
        ctx.fillRect(0, 0, w, wfTop);

        if (ridgeHistory.length > 0 && audioCtx && analyser) {
          const latestRow = ridgeHistory[0];
          const sampleRate = audioCtx.sampleRate;
          const binCount = analyser.frequencyBinCount;
          const nyquist = sampleRate / 2;

          ctx.beginPath();
          ctx.moveTo(0, wfTop - 18);
          for (let x = 0; x < w; x += 2) {
            const freq = xToFreq(x, w);
            const exactBin = (freq / nyquist) * binCount;
            const b0 = Math.max(0, Math.min(latestRow.length - 1, Math.floor(exactBin)));
            const norm = latestRow[b0] / 255;
            const y = (wfTop - 18) - norm * 42;
            ctx.lineTo(x, y);
          }
          ctx.lineTo(w, wfTop - 18);
          ctx.closePath();

          const envGrad = ctx.createLinearGradient(0, wfTop - 62, 0, wfTop - 18);
          envGrad.addColorStop(0, 'rgba(56, 189, 248, 0.38)');
          envGrad.addColorStop(1, 'rgba(56, 189, 248, 0.03)');
          ctx.fillStyle = envGrad;
          ctx.fill();

          ctx.strokeStyle = 'rgba(125, 211, 252, 0.85)';
          ctx.lineWidth = 1.5;
          ctx.stroke();
        }

        // 4. Draw frequency ruler along the bottom edge of the top strip
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(0, wfTop - 18, w, 18);
        ctx.strokeStyle = 'rgba(71, 85, 105, 0.8)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(0, wfTop);
        ctx.lineTo(w, wfTop);
        ctx.stroke();

        for (let freq = Math.ceil(displayMinHz / 100) * 100; freq <= displayMaxHz; freq += 100) {
          const x = freqToX(freq, w);
          const isMajor = freq % gridStepHz === 0;
          ctx.strokeStyle = isMajor ? 'rgba(148, 163, 184, 0.65)' : 'rgba(148, 163, 184, 0.25)';
          ctx.beginPath();
          ctx.moveTo(x, wfTop - (isMajor ? 6 : 3));
          ctx.lineTo(x, wfTop);
          ctx.stroke();

          if (isMajor) {
            ctx.fillStyle = '#94a3b8';
            ctx.font = '500 10px "JetBrains Mono", monospace';
            ctx.fillText(`${freq}`, x, wfTop - 7);
          }
        }

        // 5. Draw live formant peak markers & Hz labels in the top strip (so current formant frequencies are always readable)
        [
          { hz: liveF1Hz, prom: liveF1Prominence },
          { hz: liveF2Hz, prom: liveF2Prominence }
        ].forEach((peak) => {
          const px = freqToX(peak.hz, w);
          if (px < 10 || px > w - 10) return;

          const py = (wfTop - 18) - Math.max(0.15, peak.prom) * 42;

          // Small pointer dot on the live envelope hill
          ctx.fillStyle = '#f8fafc';
          ctx.beginPath();
          ctx.arc(px, py, 3.5, 0, Math.PI * 2);
          ctx.fill();

          // Live formant frequency tag above the hill
          const label = `${Math.round(peak.hz)} Гц`;
          ctx.font = '700 11px "JetBrains Mono", monospace';
          const textW = ctx.measureText(label).width;
          const boxX = Math.max(4, Math.min(w - textW - 12, px - textW * 0.5 - 4));
          const boxY = 4;

          ctx.fillStyle = 'rgba(15, 23, 42, 0.88)';
          ctx.strokeStyle = 'rgba(56, 189, 248, 0.6)';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.roundRect(boxX, boxY, textW + 8, 18, 4);
          ctx.fill();
          ctx.stroke();

          ctx.fillStyle = '#e0f2fe';
          ctx.textAlign = 'center';
          ctx.fillText(label, boxX + (textW + 8) * 0.5, boxY + 13);
        });

        // 6. Draw the TWO VERTICAL DASHED CALIBRATION LINES across the entire graph
        [refF1, refF2].forEach((refHz) => {
          const rx = freqToX(refHz, w);
          if (rx < 0 || rx > w) return;

          ctx.save();
          ctx.setLineDash([7, 6]);
          ctx.lineWidth = 2;
          ctx.strokeStyle = isCalibratingHold
            ? 'rgba(251, 191, 36, 0.95)'
            : 'rgba(251, 191, 36, 0.82)';
          ctx.beginPath();
          ctx.moveTo(rx, wfTop - 18);
          ctx.lineTo(rx, h);
          ctx.stroke();
          ctx.restore();

          // Reference Hz label attached to the dashed line at the top of the waterfall
          const refText = `${Math.round(refHz)}`;
          ctx.font = '700 10px "JetBrains Mono", monospace';
          const tw = ctx.measureText(refText).width;
          ctx.fillStyle = 'rgba(15, 23, 42, 0.88)';
          ctx.fillRect(rx - tw * 0.5 - 3, wfTop + 4, tw + 6, 15);
          ctx.fillStyle = '#fbbf24';
          ctx.textAlign = 'center';
          ctx.fillText(refText, rx, wfTop + 15);
        });
      }

      function animateLoop() {
        if (!isRunning) return;
        analyzeWhisperFormants();
        drawVisualizer();
        requestAnimationFrame(animateLoop);
      }
    })();
  </script>
</body>
